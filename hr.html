.logo-wrap{display:block;perspective:700px;width:120px;margin:0 auto;text-decoration:none}
.logo{display:block;position:relative;width:120px;height:73px;font-size:0;transform-style:preserve-3d;animation:spin 8s linear infinite}
.logo .f{display:block;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(110deg,#1c1c1f 0%,#7d7d85 22%,#2a2a2e 40%,#9a9aa2 52%,#222226 68%,#6f6f77 85%,#1c1c1f 100%);background-size:250% 100%;animation:shine 3.5s linear infinite;-webkit-mask:var(--sig) center/contain no-repeat;mask:var(--sig) center/contain no-repeat}
.logo .b{position:absolute;inset:0;transform:rotateY(180deg)}
@keyframes spin{to{transform:rotateY(360deg)}}@keyframes shine{to{background-position:-250% 0}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
.sub{text-align:center;font-size:10px;letter-spacing:.24em;color:var(--muted);margin:16px 0 30px}
#gate{max-width:340px;margin:12vh auto;padding:0 20px}
nav{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;padding:4px 16px 20px}
nav a{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding-bottom:6px;border-bottom:1px solid transparent}
nav a.on{color:var(--text);border-color:var(--text)}
main{max-width:560px;margin:0 auto;padding:0 20px 60px}
.k{font-size:11px;letter-spacing:.2em;color:var(--muted);text-align:center;margin:18px 0 8px}
#clock{font-size:42px;font-weight:500;text-align:center;letter-spacing:.04em;margin-bottom:18px}
.box{border:1px solid var(--line);background:var(--panel);aspect-ratio:1;margin-bottom:14px;overflow:hidden}
.box.s{max-width:180px;aspect-ratio:1}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
input,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;padding:12px;margin-bottom:10px;border-radius:0}
.btn{width:100%;border:1px solid var(--text);background:none;color:var(--text);font:inherit;font-size:11px;letter-spacing:.14em;padding:13px;cursor:pointer;margin-bottom:10px;text-transform:uppercase}
.btn:hover,.btn.f{background:var(--text);color:var(--bg)}
.msg{text-align:center;font-size:13px;min-height:22px;margin:4px 0 10px}
ul{list-style:none;margin:10px 0 0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
li small,li span{color:var(--muted);font-size:11px;letter-spacing:.04em}
li a,.who a{color:var(--muted);font-size:11px;letter-spacing:.1em;cursor:pointer;margin-left:10px}
.who{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.1em;padding:0 20px 14px;max-width:560px;margin:auto}
.gt2{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;color:var(--muted);margin:30px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cp{font-size:12px;letter-spacing:normal;color:var(--muted);text-align:center;margin:34px 0 0}
.fl{display:grid;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:12px}
.im img{width:100%;border:1px solid var(--line);display:block;margin-bottom:10px}.im.p img{max-width:160px}
.ph{border:1px dashed var(--line);padding:26px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.12em;margin-bottom:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}th{color:var(--muted);font-weight:400;font-size:10px;letter-spacing:.1em}
td:first-child,th:first-child{text-align:left}
td b{font-weight:400;color:var(--muted);display:inline-block;min-width:34px;padding:4px 0;cursor:default}
td b.o{background:var(--text);color:var(--bg);font-size:10px}
.ed td b{cursor:pointer}
</style>
</head>
<body>

<div id="gate">
  <a class="logo-wrap" aria-label="ilmusli"><span class="logo"><span class="f"></span><span class="f b" aria-hidden="true"></span></span></a>
  <div class="sub">THE PEOPLE BEHIND THE BLACK</div>
  <p class="k" id="gt">TEAM ACCESS</p>
  <input id="cd" placeholder="Code" autocomplete="username" autocapitalize="characters">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn f" id="gb" onclick="enter()">Enter</button>
  <div class="msg" id="gm"></div>
  <div class="gt2"><span id="gd"></span><span id="gc"></span></div>
  <ul>
    <li>Clock in &amp; out<span>FACE + CODE</span></li>
    <li>Weekly days off<span>YOUR SCHEDULE</span></li>
    <li>Team notices<span>FROM MANAGEMENT</span></li>
  </ul>
  <p class="cp">&copy; ilmusli. All rights reserved.</p>
</div>

<div id="app" class="hide">
  <div style="padding:14px 0 0"><a class="logo-wrap" aria-label="ilmusli"><span class="logo"><span class="f"></span><span class="f b" aria-hidden="true"></span></span></a><div class="sub" id="sub2"></div></div>
  <nav id="nav"></nav>
  <div class="who"><span id="who"></span><a onclick="location.reload()">LOGOUT</a></div>
  <main>

  <section id="s-clock" class="hide">
    <div id="clock"></div>
    <div class="box"><video id="cam" autoplay playsinline muted></video></div>
    <button class="btn f" onclick="punch()">Clock in / out</button>
    <button class="btn" id="enr" onclick="enroll()">Register my face</button>
    <div class="msg" id="msg"></div>
    <p class="k">MY DETAILS</p><ul id="mine"></ul>
    <p class="k">LAST 7 DAYS</p><ul id="myl"></ul>
  </section>

  <section id="s-today" class="hide"><p class="k">TODAY</p><ul id="todayL"></ul></section>

  <section id="s-team" class="hide">
    <input id="tn" placeholder="Name">
    <input id="tc" placeholder="Code (e.g. ILM12)" autocapitalize="characters">
    <input id="tp" type="password" placeholder="Password for this person">
    <select id="tr"><option value="staff">Employee</option><option value="manager">Manager</option><option value="founder">Founder (full access)</option></select>
    <select id="tpos" onchange="fs()"></select>
    <input id="ts" type="number" placeholder="Monthly salary (EGP)">
    <div class="box s"><video id="cam2" autoplay playsinline muted></video></div>
    <button class="btn" onclick="capt()">Capture face</button>
    <div class="msg" id="tm"></div>
    <button class="btn f" onclick="add()">Add person</button>
    <ul id="tl"></ul>
  </section>

  <section id="s-sch" class="hide"><p class="k">WEEKLY DAYS OFF</p><div class="tw"><table id="sch"></table></div></section>

  <section id="s-prof" class="hide"><p class="k" id="pk"></p><div id="pbox"></div><input type="file" id="fi" accept="image/*" class="hide"></section>

  <section id="s-notes" class="hide"><p class="k">NOTICES</p>
    <div id="npost"><input id="nt" placeholder="Write a notice for the team"><button class="btn f" onclick="postNote()">Post notice</button></div>
    <ul id="nl"></ul></section>

  <section id="s-owner" class="hide">
    <p class="k">MONTHLY PAYROLL</p><div id="pay" style="text-align:center;font-size:30px;margin-bottom:24px"></div>
    <button class="btn" onclick="chpw()">Change my password</button>
    <button class="btn" onclick="exp()">Export backup</button>
    <button class="btn" onclick="$('imp').click()">Import backup</button>
    <input type="file" id="imp" class="hide" accept=".json" onchange="imp(event)">
    <button class="btn" onclick="if(confirm('Delete all attendance logs?')){D.logs=[];sv();alert('Done')}">Clear attendance logs</button>
  </section>
  </main>
</div>

<canvas id="cv" width="32" height="32" class="hide"></canvas>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D;try{D=JSON.parse(localStorage.getItem('ilmhr'))}catch(e){}D=D||{users:[],logs:[]};D.notes=D.notes||[];
const sv=()=>{try{localStorage.setItem('ilmhr',JSON.stringify(D))}catch(e){alert('Storage is full. Export a backup and remove some images.')}};
const day=()=>new Date().toISOString().slice(0,10),hm=d=>new Date(d).toTimeString().slice(0,5),fm=n=>n.toLocaleString('en-US');
const DN=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'],DG=[6,0,1,2,3,4,5];
const POS=[['Creative Director',60000],['General Manager',47000],['Production Manager',35000],['Marketing Manager',35000],['E-commerce Manager',27000],['Fashion Designer',22000],['Pattern Maker',17000],['Photographer / Videographer',18000],['Content Creator',15000],['Graphic Designer',14000],['Accountant',15000],['HR Officer',17000],['Quality Control',10000],['Tailor',9500],['Cutter',9000],['Customer Service',9000],['Warehouse / Inventory',9000],['Store Sales Assistant',8000],['Packing & Finishing',7500],['Delivery Courier',7500],['Intern',4000]];
let me=null,pf=null,fails=0,lock=0,stream=null;

async function H(s){s='ilm:'+s;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return'x'+(h>>>0)}
const gm=t=>$('gm').textContent=t;

if(!D.users.length){$('gt').textContent='SET OWNER PASSWORD';$('cd').classList.add('hide');$('gb').textContent='Create owner'}
['cd','pw'].forEach(i=>$(i).addEventListener('keydown',e=>e.key==='Enter'&&enter()));

async function enter(){
  const p=$('pw').value;
  if(!D.users.length){if(p.length<6)return gm('At least 6 characters');D.users.push({code:'OWNER',name:'Owner',role:'owner',h:await H(p),off:[]});sv();return start(D.users[0])}
  if(Date.now()<lock)return gm('Too many attempts, wait 30 seconds');
  const u=D.users.find(x=>x.code===$('cd').value.trim().toUpperCase());
  if(u&&u.h===await H(p))return start(u);
  if(++fails>=5){lock=Date.now()+30000;fails=0}
  gm('Wrong code or password');
}

function start(u){
  me=u;$('gate').classList.add('hide');$('app').classList.remove('hide');
  $('who').textContent=u.role==='owner'?'OWNER':u.name.toUpperCase()+' · '+u.role.toUpperCase();
  $('sub2').textContent=isTop(u)?'WHERE EVERY PIECE BEGINS':u.role==='manager'?'HOLDING THE THREAD':'MADE BY HAND, MADE TOGETHER';
  const T=isTop(u)?[['today','Today'],['team','Team'],['sch','Schedule'],['notes','Notices'],['owner','Owner']]
    :u.role==='manager'?[['clock','Clock'],['today','Today'],['team','Team'],['sch','Schedule'],['notes','Notices']]
    :[['clock','Clock'],['prof','Profile'],['sch','Schedule'],['notes','Notices']];
  $('nav').innerHTML=T.map(t=>`<a id="n-${t[0]}" onclick="tab('${t[0]}')">${t[1]}</a>`).join('');
  const own=isTop(u);
  $('ts').classList.toggle('hide',!own);$('tr').classList.toggle('hide',!own);
  if(u.role!=='owner')$('tr').querySelector('[value=founder]').remove();
  $('tpos').innerHTML=POS.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('');
  startCam();tab(T[0][0]);
}
function tab(t){
  ['clock','today','team','sch','notes','prof','owner'].forEach(s=>{$('s-'+s).classList.toggle('hide',s!==t);const n=$('n-'+s);n&&(n.className=s===t?'on':'')});
  ({clock:rClock,today:rToday,team:rTeam,sch:rSch,notes:rNotes,prof:rProf,owner:rOwner})[t]();
}
const tick=()=>{const n=new Date(),t=n.toTimeString().slice(0,8);$('clock').textContent=t;$('gc').textContent=t;$('gd').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()};tick();setInterval(tick,1000);

/* camera + face */
function startCam(){navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>{stream=s;$('cam').srcObject=s;$('cam2').srcObject=s}).catch(()=>{})}
function vec(){
  const v=$('cam');if(!v.videoWidth)return null;
  const x=$('cv').getContext('2d',{willReadFrequently:true}),s=Math.min(v.videoWidth,v.videoHeight)*.7;
  x.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,32,32);
  const d=x.getImageData(0,0,32,32).data,g=[];
  for(let i=0;i<d.length;i+=4)g.push(.3*d[i]+.59*d[i+1]+.11*d[i+2]);
  const m=g.reduce((a,b)=>a+b)/g.length,sd=Math.sqrt(g.reduce((a,b)=>a+(b-m)**2,0)/g.length)||1;
  return g.map(v=>(v-m)/sd);
}
const sim=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0)/a.length;
const say=t=>{$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',4000)};

/* clock */
function punch(){
  const v=vec();if(!v)return say('Camera is off — allow camera access');
  if(me.f){if(sim(v,me.f)<.93)return say('Face does not match')}else return say('Register your face first');
  const l=D.logs.find(x=>x.c===me.code&&x.d===day()),now=new Date().toISOString();
  if(!l){D.logs.push({c:me.code,d:day(),i:now,o:null});say('Clocked in '+hm(now))}
  else if(!l.o){l.o=now;say('Clocked out '+hm(now))}else say('Already done today');
  sv();rClock();
}
function enroll(){const v=vec();if(!v)return say('Camera is off');me.f=v;sv();say('Face registered');rClock()}
function rClock(){
  $('enr').classList.toggle('hide',!!me.f);
  const off=(me.off||[]).map(g=>DN[DG.indexOf(g)]).join(', ')||'—';
  $('mine').innerHTML=`<li>Name<span>${esc(me.name)}</span></li><li>Position<span>${esc(me.pos||'—')}</span></li><li>Code<span>${esc(me.code)}</span></li><li>Days off<span>${off}</span></li>`;
  $('myl').innerHTML=D.logs.filter(l=>l.c===me.code).slice(-7).reverse().map(l=>`<li>${l.d}<span>${hm(l.i)} → ${l.o?hm(l.o):'—'}</span></li>`).join('')||'<li><span>No records</span></li>';
}

/* today */
function rToday(){
  const wd=new Date().getDay();
  $('todayL').innerHTML=D.users.filter(u=>!isTop(u)).map(u=>{
    const l=D.logs.find(x=>x.c===u.code&&x.d===day());
    const st=l?`${hm(l.i)} → ${l.o?hm(l.o):'—'}`:(u.off||[]).includes(wd)?'Day off':'Absent';
    return`<li>${esc(u.name)}<span>${st}</span></li>`}).join('')||'<li><span>No team yet</span></li>';
}

/* team */
function fs(){isTop(me)&&($('ts').value=POS[$('tpos').value][1])}
function capt(){const v=vec();$('tm').textContent=v?(pf=v,'Face captured'):'Camera is off'}
async function add(){
  const n=$('tn').value.trim(),c=$('tc').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,''),p=$('tp').value;
  if(!n||!c||p.length<4||D.users.some(x=>x.code===c))return $('tm').textContent='Fill all fields · unique code · password 4+ characters';
  const own=isTop(me);
  D.users.push({code:c,name:n,role:own?$('tr').value:'staff',h:await H(p),pos:POS[$('tpos').value][0],sal:own?+$('ts').value||0:0,f:pf,off:[]});
  pf=null;['tn','tc','tp'].forEach(i=>$(i).value='');$('tm').textContent='';sv();rTeam();
}
function isTop(u){return u.role==='owner'||u.role==='founder'}
const can=u=>u.role!=='owner'&&(me.role==='owner'||(me.role==='founder'&&u.role!=='founder')||(me.role==='manager'&&u.role==='staff'));
function rTeam(){
  if(isTop(me))fs();
  $('tl').innerHTML=D.users.filter(u=>u.role!=='owner'&&(isTop(me)||u.role!=='founder')).map(u=>`<li><div>${esc(u.name)}<br><small>${u.role} · ${esc(u.pos||'')} · ${esc(u.code)}${u.f?' · face':''}${isTop(me)?' · '+fm(u.sal||0)+' EGP':''}</small></div><div>${isTop(me)||u.role==='staff'?`<a onclick="openProf('${u.code}')">PROFILE</a>`:''}${isTop(me)?`<a onclick="sal('${u.code}')">SALARY</a>`:''}${can(u)?`<a onclick="rp('${u.code}')">PASSWORD</a><a onclick="rm('${u.code}')">REMOVE</a>`:''}</div></li>`).join('')||'<li><span>No one yet</span></li>';
}
async function rp(c){const p=prompt('New password (4+ characters)');if(p&&p.length>=4){D.users.find(x=>x.code===c).h=await H(p);sv();alert('Password updated')}}
function rm(c){if(confirm('Remove '+c+'?')){D.users=D.users.filter(x=>x.code!==c);sv();rTeam()}}
function sal(c){const u=D.users.find(x=>x.code===c),v=prompt('Monthly salary (EGP)',u.sal||0);if(v!==null){u.sal=+v||0;sv();rTeam()}}

/* schedule */
function rSch(){
  const ed=me.role!=='staff';$('sch').className=ed?'ed':'';
  let h='<tr><th>TEAM</th>'+DN.map(d=>`<th>${d.toUpperCase()}</th>`).join('')+'</tr>';
  D.users.filter(u=>!isTop(u)).forEach(u=>{
    h+=`<tr><td>${esc(u.name)}</td>`+DG.map(g=>{const o=(u.off||[]).includes(g);return`<td><b class="${o?'o':''}"${ed?` onclick="tg('${u.code}',${g})"`:''}>${o?'OFF':'·'}</b></td>`}).join('')+'</tr>'});
  $('sch').innerHTML=h;
}
function tg(c,g){const u=D.users.find(x=>x.code===c);u.off=u.off||[];const i=u.off.indexOf(g);i<0?u.off.push(g):u.off.splice(i,1);sv();rSch()}

/* profile */
let cur=null;
const EDU=['Primary','Preparatory','Secondary / Vocational','Diploma','Bachelor','Master','PhD'];
const MIL=['Completed','Exempted','Postponed','Currently serving','Not required (female)','Not yet due'];
const PF=[['phone','Phone','tel'],['nid','National ID (14 digits)','text'],['bd','Date of birth','date'],['addr','Address','text'],['edu','Qualification','sel',EDU],['maj','Major / institution','text'],['mil','Military service','sel',MIL],['ec','Emergency contact (name & phone)','text'],['hire','Hire date','date']];
function openProf(c){cur=c;tab('prof')}
function rProf(){
  const self=me.role==='staff',u=D.users.find(x=>x.code===(self?me.code:cur));
  if(!u){$('pbox').innerHTML='';return}
  const ed=!self&&can(u);
  $('pk').textContent=u.name.toUpperCase()+' · '+(u.pos||'').toUpperCase();
  const im=(k,l,cls)=>`<div class="im ${cls||''}"><p class="k" style="text-align:left">${l}</p>${u[k]?`<img src="${u[k]}">`:'<div class="ph">NO IMAGE</div>'}${ed?`<button class="btn" onclick="pick('${k}')">${u[k]?'Replace':'Upload'}</button>`:''}</div>`;
  let h=im('photo','PHOTO','p');
  if(!self){h+=im('idf','ID CARD · FRONT')+im('idb','ID CARD · BACK')}
  else h+=`<ul><li>ID card<span>${u.idf?'ON FILE':'NOT UPLOADED'}</span></li></ul>`;
  h+='<p class="k" style="text-align:left;margin-top:22px">DETAILS</p>';
  PF.forEach(f=>{
    let v=u[f[0]]||'';
    if(ed)h+=`<label class="fl">${f[1].toUpperCase()}`+(f[2]==='sel'?`<select onchange="sf('${f[0]}',this.value)"><option value="">—</option>${f[3].map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select>`:`<input type="${f[2]}" value="${esc(v)}" onchange="sf('${f[0]}',this.value)">`)+'</label>';
    else{if(f[0]==='nid'&&self&&v)v='••••••••••'+v.slice(-4);h+=`<ul style="margin:0"><li>${f[1]}<span>${esc(v)||'—'}</span></li></ul>`}
  });
  if(isTop(me)&&!self)h+=`<ul style="margin:0"><li>Monthly salary<span>${fm(u.sal||0)} EGP</span></li></ul>`;
  if(!self){const L=D.logs.filter(l=>l.c===u.code).slice(-14).reverse();h+='<p class="k" style="text-align:left;margin-top:22px">ATTENDANCE · LAST 14 DAYS</p><ul>'+(L.map(l=>`<li>${l.d}<span>${hm(l.i)} → ${l.o?hm(l.o):'—'}</span></li>`).join('')||'<li><span>No records</span></li>')+'</ul>'}
  $('pbox').innerHTML=h;
}
function sf(k,v){
  if(k==='nid'&&v&&!/^\d{14}$/.test(v)){alert('National ID must be exactly 14 digits');return rProf()}
  const u=D.users.find(x=>x.code===cur);u[k]=v;sv();
}
function pick(k){$('fi').dataset.k=k;$('fi').click()}
$('fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const k=$('fi').dataset.k,r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas'),g=c.getContext('2d');
    if(k==='photo'){const s=Math.min(im.width,im.height);c.width=c.height=240;g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240)}
    else{const w=Math.min(520,im.width);c.width=w;c.height=im.height*w/im.width;g.drawImage(im,0,0,c.width,c.height)}
    const u=D.users.find(x=>x.code===cur);u[k]=c.toDataURL('image/jpeg',k==='photo'?.8:.55);sv();e.target.value='';rProf()};
    im.src=r.result};
  r.readAsDataURL(f);
};

/* notices */
function rNotes(){
  const ed=me.role!=='staff';$('npost').classList.toggle('hide',!ed);
  $('nl').innerHTML=D.notes.slice().reverse().map(n=>`<li><div>${esc(n.t)}<br><small>${esc(n.by)} · ${n.d}</small></div>${ed?`<a onclick="delNote(${n.id})">REMOVE</a>`:''}</li>`).join('')||'<li><span>No notices yet</span></li>';
}
function postNote(){const t=$('nt').value.trim();if(!t)return;D.notes.push({id:Date.now(),t,by:me.name,d:day()});$('nt').value='';sv();rNotes()}
function delNote(id){D.notes=D.notes.filter(n=>n.id!==id);sv();rNotes()}

/* owner */
function rOwner(){$('pay').textContent=fm(D.users.reduce((s,u)=>s+(u.sal||0),0))+' EGP'}
async function chpw(){const p=prompt('New password (6+ characters)');if(p&&p.length>=6){me.h=await H(p);sv();alert('Updated')}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='ilmusli-hr-backup.json';a.click()}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users||!d.logs)throw 0;if(confirm('Replace current data with this backup?')){D=d;sv();location.reload()}}catch(x){alert('Invalid file')}};r.readAsText(f)}
</script>
</body>
